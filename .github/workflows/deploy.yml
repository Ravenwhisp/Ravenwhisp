name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2 # Minor bump handles Node 24 better

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0 # Upgraded to v4.4.0 for Node 24 compatibility

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0 # Updated to latest v4 point release
        with:
          node-version: 22 # Recommended: Use Node 22 (LTS) or 24 instead of 20
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.0
